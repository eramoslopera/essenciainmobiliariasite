.ei-hero * { box-sizing: border-box; margin: 0; padding: 0; }
.ei-hero {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 5rem;
  overflow: hidden;
  font-family: 'Manrope', sans-serif;
}
.ei-hero-slides {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.ei-hero-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1s ease-in-out;
  z-index: 0;
}
.ei-hero-slide.active {
  opacity: 1;
}
.ei-hero-bg {
  width: 100%;
  height: 100%;
  background-size: cover;
  transition: transform 8s linear;
  transform: scale(1);
}
.ei-hero-slide.active .ei-hero-bg {
  transform: scale(1.1);
}

.ei-hero-overlay1 { position: absolute; inset: 0; z-index: 1; background: rgba(255,255,255,0.4); }
.ei-hero-overlay2 { position: absolute; inset: 0; z-index: 1; background: linear-gradient(to top, rgba(255,255,255,0.6), rgba(255,255,255,0.4), transparent); }
.ei-hero-content {
  position: relative;
  z-index: 2;
  max-width: 1024px;
  margin: 0 auto;
  padding: 0 1.5rem;
  text-align: center;
  display: flex;
  flex-direction: column;

}
.ei-hero-badge {

.ei-hero-title {

.ei-hero-subtitle {

  letter-spacing: -0.01em;
}
.ei-hero-buttons {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  justify-content: center;
  align-items: center;
  width: 100%;
}
@media (min-width: 640px) {
  .ei-hero-buttons {
    flex-direction: row;
  }
}
.ei-hero-btn {
  height: 3.5rem !important;
  padding: 0 2.5rem !important;
  border-radius: 9999px !important;
  font-size: 11px !important;
  font-weight: 900 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.2em !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 0.5rem !important;
  text-decoration: none !important;
  transition: all 0.3s ease !important;
  cursor: pointer !important;
  border: none !important;
  font-family: 'Manrope', sans-serif !important;
  white-space: nowrap !important;
}
.ei-btn-dark {

.ei-btn-dark:hover {

}
.ei-btn-dark:active {

}
.ei-btn-light {

  border: 1px solid rgba(255,255,255,0.5) !important;
  box-shadow: none !important;
}
.ei-btn-light:hover {

}
.ei-btn-light:active {

}
.ei-btn-light svg {
  transition: transform 0.3s ease !important;
}
.ei-btn-light:hover svg {

}
.ei-hero-dots {

.ei-hero-dot {

  cursor: pointer;
  padding: 0;
  transition: all 0.5s ease;
}
.ei-hero-dot:hover {
  background: #9ca3af;
}
.ei-hero-dot.active {
  background: #222222;
  transform: scale(1.5);
}

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const slides = document.querySelectorAll('#ei-hero-slides .ei-hero-slide');
    const dots = document.querySelectorAll('#ei-hero-dots .ei-hero-dot');
    let currentIndex = 0;
    
    function showSlide(index) {
      slides.forEach(s => s.classList.remove('active'));
      dots.forEach(d => d.classList.remove('active'));
      slides[index].classList.add('active');
      dots[index].classList.add('active');
      currentIndex = index;
    }
    
    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => showSlide(index));
    });
    
    setInterval(() => {
      let nextIndex = (currentIndex + 1) % slides.length;
      showSlide(nextIndex);
    }, 5000);
  });
</script>
